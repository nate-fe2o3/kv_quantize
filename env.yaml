# Serverless custom environment for the FibQuant CUDA eval (scripts/eval_cuda.py).
#
# Attach: notebook Environment side pane > Base environment > Custom > select this file.
# Python comes from environment_version ('5' = 3.12.3, newest; no 3.13 environment
# exists yet, but a clean env + typing_extensions>=4.15 covers lm-eval's PEP 728
# extra_items TypedDict on 3.12).
#
# Versions match the local dev environment (uv venv, transformers 5.15.1) so eval
# results stay comparable.
environment_version: "5"
dependencies:
  - transformers==5.15.1
  - lm-eval==0.4.12
  - accelerate==1.14.0
  # dataset stack: unpinned, pip resolved a datasets/huggingface_hub pair whose
  # HfFileSystem.find() signatures collide ("multiple values for 'maxdepth'");
  # these are the versions proven in the local dev venv
  - datasets==5.0.1
  - huggingface_hub==1.28.0
  - evaluate==0.4.6
  - fsspec==2026.6.0
  - langdetect>=1.0.9
  - immutabledict>=4.3.1
  - nltk>=3.10.3
  - scipy>=1.18.0
  - typing_extensions==4.16.0 # PEP 728 extra_items backport for lm-eval 0.4.12 on py3.12
  # torch intentionally omitted: the serverless GPU environment preinstalls a
  # CUDA-matched torch (transformers 5.15.1 only needs torch>=2.5); pip-installing
  # torch here could pull CPU/mismatched-CUDA wheels.
